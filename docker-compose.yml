# Lokalna baza danych. Start: docker compose up -d --wait
name: ekipanatermin

services:
  postgres:
    # Ta sama wersja główna co w Neon (ADR 0002).
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Dane tylko do pracy lokalnej; port dostępny wyłącznie z tego komputera.
      POSTGRES_USER: ekipa
      POSTGRES_PASSWORD: ekipa
      POSTGRES_DB: ekipa
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ekipa -d ekipa']
      interval: 2s
      timeout: 3s
      retries: 30

  # Lokalna skrzynka na e-maile (SMTP 1025, podgląd http://localhost:8025). Nic nie wychodzi na zewnątrz.
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres-data:
